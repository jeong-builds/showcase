<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근태 관리자 대시보드 — Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#4F46E5;--bg:#F9FAFB;--surface:#FFFFFF;--border:#E5E7EB;--text:#111827;--sub:#6B7280;--success:#10B981;--danger:#EF4444;--warning:#F59E0B;}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans KR',sans-serif;}
        body{background:var(--bg);color:var(--text);min-height:100vh;}
        nav{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:100;}
        .nav-logo{font-weight:700;font-size:.95rem;}
        .nav-logo span{color:var(--primary);}
        .nav-right{display:flex;align-items:center;gap:12px;font-size:.82rem;color:var(--sub);}
        .demo-badge{background:#fee2e2;color:#991b1b;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;}
        main{max-width:1100px;margin:0 auto;padding:72px 22px 60px;}
        .page-title{font-size:1.8rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.25rem;}
        .page-sub{font-size:.85rem;color:var(--sub);margin-bottom:1.8rem;}
        /* Login */
        #login-overlay{position:fixed;inset:0;background:#F9FAFB;z-index:200;display:flex;align-items:center;justify-content:center;}
        .login-card{background:white;border-radius:20px;padding:2.5rem;box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid var(--border);width:100%;max-width:380px;text-align:center;}
        .login-icon{font-size:2.5rem;margin-bottom:.8rem;}
        .login-title{font-size:1.3rem;font-weight:700;color:var(--primary);margin-bottom:.3rem;}
        .login-sub{font-size:.82rem;color:var(--sub);margin-bottom:1.5rem;}
        .demo-hint{background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:.78rem;color:#92400e;text-align:left;margin-bottom:1.2rem;}
        label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.4rem;text-align:left;}
        input[type="password"]{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit;letter-spacing:.2rem;text-align:center;margin-bottom:1rem;}
        input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15);}
        .btn{width:100%;padding:11px;border:none;border-radius:8px;font-weight:600;font-size:.95rem;cursor:pointer;background:var(--primary);color:white;transition:all .2s;}
        .btn:hover{background:#4338CA;}
        /* Stats */
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:2rem;}
        .stat-card{background:white;border:1px solid var(--border);border-radius:14px;padding:1.1rem;text-align:center;}
        .stat-num{font-size:1.9rem;font-weight:700;}
        .stat-label{font-size:.72rem;color:var(--sub);margin-top:3px;}
        .c-blue{color:var(--primary);} .c-green{color:#059669;} .c-amber{color:#d97706;} .c-red{color:var(--danger);}
        /* Tabs */
        .tabs{display:flex;gap:6px;margin-bottom:1.2rem;flex-wrap:wrap;}
        .tab-btn{padding:7px 18px;border:1px solid var(--border);border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer;background:white;color:var(--sub);font-family:inherit;transition:all .2s;}
        .tab-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
        /* Table */
        .table-wrap{background:white;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:2rem;}
        table{width:100%;border-collapse:collapse;font-size:.8rem;}
        thead th{background:#f9fafb;font-weight:700;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);color:var(--sub);font-size:.72rem;white-space:nowrap;}
        tbody td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
        tbody tr:last-child td{border-bottom:none;}
        tbody tr:hover td{background:#fafafa;}
        .name-cell{font-weight:600;}
        .rank-cell{font-size:.75rem;color:var(--sub);}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
        .dot-ok{background:var(--success);} .dot-late{background:var(--warning);} .dot-absent{background:var(--danger);} .dot-out{background:#d1d5db;}
        .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:600;}
        .badge-ok{background:#d1fae5;color:#065f46;} .badge-late{background:#fef3c7;color:#92400e;} .badge-absent{background:#fee2e2;color:#991b1b;} .badge-out{background:#f3f4f6;color:#6b7280;}
        /* Anomaly list */
        .anomaly-card{background:white;border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
        .anomaly-info{flex:1;}
        .anomaly-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
        .anomaly-name{font-weight:700;font-size:.9rem;}
        .anomaly-date{font-size:.8rem;color:var(--sub);}
        .anomaly-type{background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:700;}
        .anomaly-explanation{font-size:.8rem;color:var(--sub);margin-top:4px;background:#f9fafb;padding:6px 10px;border-radius:6px;border:1px solid var(--border);}
        .action-btns{display:flex;gap:6px;flex-shrink:0;flex-direction:column;}
        .act-btn{padding:5px 12px;border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
        .act-confirm{background:#d1fae5;color:#065f46;}
        .act-confirm:hover{background:#a7f3d0;}
        .act-reject{background:#fee2e2;color:#991b1b;}
        .act-reject:hover{background:#fecaca;}
        .status-confirmed{background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;}
        .status-pending{background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;}
        /* Month nav */
        .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
        .mnav-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:.82rem;font-weight:600;font-family:inherit;}
        .month-label{font-weight:700;font-size:.95rem;min-width:90px;text-align:center;}
        .section-title{font-size:1rem;font-weight:700;margin-bottom:.8rem;color:var(--text);}
        .filter-row{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
        .filt-btn{background:white;border:1px solid var(--border);padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:600;color:var(--sub);cursor:pointer;font-family:inherit;}
        .filt-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
        .empty-msg{text-align:center;color:var(--sub);padding:2rem;font-size:.9rem;}
        .logout-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:.78rem;cursor:pointer;font-family:inherit;color:var(--sub);}
        .logout-btn:hover{border-color:var(--danger);color:var(--danger);}
    </style>
</head>
<body>

<!-- Login Overlay -->
<div id="login-overlay">
    <div class="login-card">
        <div class="login-icon">🔐</div>
        <div class="login-title">관리자 대시보드</div>
        <p class="login-sub">관리자 PIN을 입력하세요</p>
        <div class="demo-hint">
            <strong>데모 계정</strong><br>
            관리자 PIN: <strong>0000</strong>
        </div>
        <label>관리자 PIN</label>
        <input type="password" id="admin-pin" maxlength="4" placeholder="0000" inputmode="numeric"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
            onkeydown="if(event.key==='Enter')handleAdminLogin()">
        <button class="btn" onclick="handleAdminLogin()">로그인</button>
        <span class="demo-badge" style="display:inline-block;margin-top:1rem;">DEMO</span>
    </div>
</div>

<nav>
    <div style="display:flex;align-items:center;gap:8px;">
        <span class="nav-logo">Intranet <span>Demo</span></span>
        <span style="background:#EEF2FF;color:var(--primary);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;">관리자 대시보드</span>
        <span class="demo-badge">DEMO</span>
    </div>
    <div class="nav-right">
        <span id="nav-user">관리자</span>
        <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
    </div>
</nav>

<main>
    <h1 class="page-title">근태 관리자 대시보드</h1>
    <p class="page-sub" id="page-sub-date">전사 근태 현황 — 더미 데이터 기준</p>

    <!-- 요약 통계 -->
    <div class="stat-grid">
        <div class="stat-card"><div class="stat-num c-blue" id="s-total">—</div><div class="stat-label">전체 직원</div></div>
        <div class="stat-card"><div class="stat-num c-green" id="s-normal">—</div><div class="stat-label">정상 출근</div></div>
        <div class="stat-card"><div class="stat-num c-amber" id="s-late">—</div><div class="stat-label">지각</div></div>
        <div class="stat-card"><div class="stat-num c-red" id="s-anomaly">—</div><div class="stat-label">이상 건수</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#7c3aed;" id="s-pending">—</div><div class="stat-label">보완 미처리</div></div>
    </div>

    <!-- 탭 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('today')">오늘 출퇴근 현황</button>
        <button class="tab-btn" onclick="switchTab('anomalies')">보완 요청 처리</button>
        <button class="tab-btn" onclick="switchTab('report')">월별 현황표</button>
    </div>

    <!-- 오늘 현황 탭 -->
    <div id="tab-today">
        <div class="section-title" id="today-label">오늘 출퇴근 현황</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>이름</th><th>직급</th><th>팀</th><th>출근</th><th>퇴근</th><th>상태</th>
                    </tr>
                </thead>
                <tbody id="today-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 보완 처리 탭 -->
    <div id="tab-anomalies" style="display:none;">
        <div class="section-title">보완 요청 처리</div>
        <div class="filter-row">
            <button class="filt-btn active" onclick="filterAnomaly('all',this)">전체</button>
            <button class="filt-btn" onclick="filterAnomaly('pending',this)">미처리</button>
            <button class="filt-btn" onclick="filterAnomaly('confirmed',this)">처리 완료</button>
        </div>
        <div id="anomaly-list"></div>
        <div id="anomaly-empty" class="empty-msg" style="display:none;">처리할 보완 요청이 없습니다. ✅</div>
    </div>

    <!-- 월별 현황 탭 -->
    <div id="tab-report" style="display:none;">
        <div class="month-nav">
            <button class="mnav-btn" onclick="changeReportMonth(-1)">‹ 이전</button>
            <div class="month-label" id="report-month-label"></div>
            <button class="mnav-btn" onclick="changeReportMonth(1)">다음 ›</button>
        </div>
        <div class="table-wrap" style="overflow-x:auto;">
            <table id="report-table">
                <thead id="report-thead"></thead>
                <tbody id="report-tbody"></tbody>
            </table>
        </div>
    </div>
</main>

<script>
const ADMIN_PIN = '0000';
const EMPLOYEES = [
    { name:'홍길동', rank:'사원', team:'영업1팀', org:'sales' },
    { name:'김영희', rank:'대리', team:'영업1팀', org:'sales' },
    { name:'이철수', rank:'과장', team:'영업2팀', org:'sales' },
    { name:'박민준', rank:'사원', team:'영업2팀', org:'sales' },
    { name:'최수연', rank:'대리', team:'마케팅팀', org:'marketing' },
    { name:'정태양', rank:'부장', team:'마케팅팀', org:'marketing' },
    { name:'한지민', rank:'사원', team:'기술지원팀', org:'tech' },
    { name:'오성진', rank:'과장', team:'기술지원팀', org:'tech' },
    { name:'임가을', rank:'대리', team:'생산팀', org:'production' },
    { name:'신동욱', rank:'사원', team:'생산팀', org:'production' },
];

// 오늘 더미 출퇴근 데이터
const TODAY_RECORDS = [
    { name:'홍길동', in:'08:52', out:'18:05', status:'ok' },
    { name:'김영희', in:'09:31', out:'18:12', status:'late' },
    { name:'이철수', in:'08:47', out:'18:00', status:'ok' },
    { name:'박민준', in:null, out:null, status:'absent' },
    { name:'최수연', in:'08:59', out:'17:58', status:'ok' },
    { name:'정태양', in:'08:45', out:null, status:'in' },
    { name:'한지민', in:'08:50', out:'18:10', status:'ok' },
    { name:'오성진', in:'09:05', out:'18:03', status:'ok' },
    { name:'임가을', in:'08:53', out:'18:07', status:'ok' },
    { name:'신동욱', in:'08:48', out:'17:55', status:'ok' },
];

// 보완 요청 더미 데이터
let ANOMALIES = [
    { id:'a1', name:'김영희', date:'2026-04-14', type:'지각', desc:'09:31 출근 (기준 09:00)', explanation:'아침 버스가 지연되었습니다.', status:'pending' },
    { id:'a2', name:'박민준', date:'2026-04-15', type:'미출근', desc:'출근 기록 없음', explanation:'재택근무 사전 승인 받았습니다.', status:'pending' },
    { id:'a3', name:'홍길동', date:'2026-04-10', type:'퇴근 미기록', desc:'퇴근 기록 없음', explanation:'거래처 미팅 후 직귀하였습니다.', status:'confirmed' },
    { id:'a4', name:'최수연', date:'2026-04-08', type:'조기퇴근', desc:'17:10 퇴근 (기준 18:00)', explanation:'개인 사정으로 반차 사용하였습니다.', status:'confirmed' },
];

let anomalyFilter = 'all';
let reportYear, reportMonth;

function handleAdminLogin() {
    const pin = document.getElementById('admin-pin').value;
    if (pin !== ADMIN_PIN) { alert('PIN이 올바르지 않습니다.'); return; }
    document.getElementById('login-overlay').style.display = 'none';
    const now = new Date();
    reportYear = now.getFullYear();
    reportMonth = now.getMonth() + 1;
    document.getElementById('page-sub-date').textContent = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 기준 — 더미 데이터`;
    document.getElementById('today-label').textContent = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} 출퇴근 현황`;
    updateStats();
    renderToday();
    renderAnomalies();
    renderReport();
}

function handleLogout() {
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('admin-pin').value = '';
}

function updateStats() {
    const total = EMPLOYEES.length;
    const normal = TODAY_RECORDS.filter(r => r.status === 'ok').length;
    const late = TODAY_RECORDS.filter(r => r.status === 'late').length;
    const anomalyCount = TODAY_RECORDS.filter(r => r.status === 'absent' || r.status === 'late').length;
    const pending = ANOMALIES.filter(a => a.status === 'pending').length;
    document.getElementById('s-total').textContent = total;
    document.getElementById('s-normal').textContent = normal;
    document.getElementById('s-late').textContent = late;
    document.getElementById('s-anomaly').textContent = anomalyCount;
    document.getElementById('s-pending').textContent = pending;
}

function switchTab(t) {
    ['today','anomalies','report'].forEach(id => {
        document.getElementById('tab-'+id).style.display = id===t ? 'block' : 'none';
    });
    document.querySelectorAll('.tab-btn').forEach((btn,i) => {
        btn.classList.toggle('active', ['today','anomalies','report'][i] === t);
    });
}

function renderToday() {
    const tbody = document.getElementById('today-tbody');
    tbody.innerHTML = TODAY_RECORDS.map(r => {
        const emp = EMPLOYEES.find(e => e.name === r.name) || {};
        const statusMap = {
            ok: ['dot-ok','badge-ok','정상'],
            late: ['dot-late','badge-late','지각'],
            absent: ['dot-absent','badge-absent','미출근'],
            in: ['dot-ok','badge-ok','출근중'],
        };
        const [dot, badge, label] = statusMap[r.status] || ['dot-out','badge-out','—'];
        return `<tr>
            <td class="name-cell">${r.name}</td>
            <td class="rank-cell">${emp.rank||'—'}</td>
            <td class="rank-cell">${emp.team||'—'}</td>
            <td style="font-size:.78rem;">${r.in || '<span style="color:#d1d5db;">—</span>'}</td>
            <td style="font-size:.78rem;">${r.out || '<span style="color:#d1d5db;">—</span>'}</td>
            <td><span class="status-dot ${dot}"></span><span class="badge ${badge}">${label}</span></td>
        </tr>`;
    }).join('');
}

function renderAnomalies() {
    const list = document.getElementById('anomaly-list');
    const empty = document.getElementById('anomaly-empty');
    let data = ANOMALIES;
    if (anomalyFilter === 'pending') data = ANOMALIES.filter(a => a.status === 'pending');
    if (anomalyFilter === 'confirmed') data = ANOMALIES.filter(a => a.status === 'confirmed');

    if (!data.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    list.innerHTML = data.map(a => `
        <div class="anomaly-card">
            <div class="anomaly-info">
                <div class="anomaly-meta">
                    <span class="anomaly-name">${a.name}</span>
                    <span class="anomaly-date">${a.date}</span>
                    <span class="anomaly-type">${a.type}</span>
                </div>
                <div style="font-size:.8rem;color:var(--sub);margin-bottom:5px;">${a.desc}</div>
                ${a.explanation ? `<div class="anomaly-explanation">💬 ${a.explanation}</div>` : ''}
            </div>
            <div class="action-btns">
                ${a.status === 'pending' ? `
                    <button class="act-btn act-confirm" onclick="processAnomaly('${a.id}','confirmed')">✓ 확인</button>
                    <button class="act-btn act-reject" onclick="processAnomaly('${a.id}','rejected')">✕ 반려</button>
                ` : `<span class="status-confirmed">처리 완료</span>`}
            </div>
        </div>
    `).join('');
}

function filterAnomaly(f, btn) {
    anomalyFilter = f;
    document.querySelectorAll('.filt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAnomalies();
}

function processAnomaly(id, result) {
    const a = ANOMALIES.find(x => x.id === id);
    if (a) { a.status = result === 'confirmed' ? 'confirmed' : 'rejected'; }
    updateStats();
    renderAnomalies();
}

// 월별 현황표 (더미 생성)
function changeReportMonth(delta) {
    reportMonth += delta;
    if (reportMonth > 12) { reportMonth = 1; reportYear++; }
    if (reportMonth < 1) { reportMonth = 12; reportYear--; }
    renderReport();
}

function renderReport() {
    document.getElementById('report-month-label').textContent = `${reportYear}년 ${String(reportMonth).padStart(2,'0')}월`;
    const daysInMonth = new Date(reportYear, reportMonth, 0).getDate();
    const weekdays = [];
    for (let d = 1; d <= daysInMonth; d++) {
        const dow = new Date(reportYear, reportMonth-1, d).getDay();
        if (dow !== 0 && dow !== 6) weekdays.push(d);
    }

    // Header
    const thead = document.getElementById('report-thead');
    thead.innerHTML = `<tr>
        <th style="background:#f9fafb;padding:8px 12px;border-bottom:1px solid var(--border);font-size:.75rem;color:var(--sub);text-align:left;white-space:nowrap;position:sticky;left:0;z-index:2;">이름</th>
        ${weekdays.map(d => {
            const dow = new Date(reportYear, reportMonth-1, d).getDay();
            const color = dow===0?'#ef4444':dow===6?'#3b82f6':'inherit';
            return `<th style="background:#f9fafb;padding:8px 6px;border-bottom:1px solid var(--border);font-size:.72rem;color:${color};text-align:center;min-width:34px;">${d}</th>`;
        }).join('')}
        <th style="background:#f9fafb;padding:8px 8px;border-bottom:1px solid var(--border);font-size:.72rem;color:var(--sub);text-align:center;">출근일</th>
        <th style="background:#f9fafb;padding:8px 8px;border-bottom:1px solid var(--border);font-size:.72rem;color:var(--sub);text-align:center;">이상</th>
    </tr>`;

    // Body
    const tbody = document.getElementById('report-tbody');
    const today = new Date();
    const todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();

    tbody.innerHTML = EMPLOYEES.map(emp => {
        let workDays = 0, anomalyDays = 0;
        const cells = weekdays.map(d => {
            const isFuture = reportYear > todayY || (reportYear===todayY && reportMonth>todayM) || (reportYear===todayY && reportMonth===todayM && d>todayD);
            if (isFuture) return `<td style="padding:6px;text-align:center;font-size:.72rem;color:#d1d5db;">—</td>`;

            // Generate deterministic status based on emp+day
            const seed = (emp.name.charCodeAt(0) + d) % 10;
            let status, bg, text;
            if (seed === 3 && d % 5 === 0) {
                status = '지각'; bg='#fef3c7'; text='#92400e'; anomalyDays++;
                workDays++;
            } else if (seed === 7 && d % 8 === 0) {
                status = '×'; bg='#fee2e2'; text='#991b1b'; anomalyDays++;
            } else {
                status = '○'; bg='#d1fae5'; text='#065f46'; workDays++;
            }
            return `<td style="padding:6px;text-align:center;font-size:.72rem;background:${bg};color:${text};font-weight:600;">${status}</td>`;
        }).join('');

        return `<tr>
            <td style="padding:8px 12px;font-weight:600;font-size:.82rem;background:#fafafa;white-space:nowrap;position:sticky;left:0;border-right:1px solid var(--border);">${emp.name}<br><span style="font-size:.68rem;color:var(--sub);font-weight:400;">${emp.rank}</span></td>
            ${cells}
            <td style="padding:6px 8px;text-align:center;font-size:.78rem;font-weight:700;color:#059669;">${workDays}</td>
            <td style="padding:6px 8px;text-align:center;font-size:.78rem;font-weight:700;color:${anomalyDays>0?'#dc2626':'#059669'};">${anomalyDays||'—'}</td>
        </tr>`;
    }).join('');
}
</script>
</body>
</html>
