<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근태 사유 관리 — Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:#4F46E5; --primary-hover:#4338CA;
            --bg:#F9FAFB; --card-bg:#FFFFFF;
            --text-main:#111827; --text-sub:#6B7280;
            --border:#E5E7EB; --danger:#EF4444; --success:#10B981;
        }
        *{box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;margin:0;padding:0;}
        body{background:var(--bg);color:var(--text-main);min-height:100vh;padding:20px;display:flex;justify-content:center;}
        .container{width:100%;max-width:500px;transition:max-width .4s;}
        .container.wide{max-width:1200px;}
        .main-layout{display:grid;grid-template-columns:1fr 1.5fr;gap:2rem;align-items:start;margin-top:1rem;}
        @media(max-width:900px){.main-layout{grid-template-columns:1fr;}}
        header{text-align:center;margin-bottom:2rem;}
        h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem;color:var(--primary);}
        header p{color:var(--text-sub);font-size:.9rem;}
        .card{background:var(--card-bg);border-radius:16px;padding:24px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border:1px solid var(--border);margin-bottom:20px;}
        label{display:block;font-size:.875rem;font-weight:600;margin-bottom:.5rem;color:var(--text-main);}
        input[type="text"],input[type="password"],input[type="date"],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;transition:all .2s;}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.15);}
        select{appearance:none;background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width%3D'12' height%3D'12'%3E%3Cpath fill%3D'%23111827' d%3D'M6 8L1 3h10z'%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}
        .btn{width:100%;padding:11px;border:none;border-radius:8px;font-weight:600;font-size:.95rem;cursor:pointer;transition:all .2s;display:flex;justify-content:center;align-items:center;gap:8px;}
        .btn-primary{background:var(--primary);color:white;}
        .btn-primary:hover{background:var(--primary-hover);}
        .btn:disabled{opacity:.5;cursor:not-allowed;}
        .tabs-container{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
        .tab-btn{flex:1;padding:8px 4px;border:1px solid var(--border);border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;background:white;color:var(--text-sub);transition:all .2s;min-width:80px;}
        .tab-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
        .user-bar{padding:13px 20px;background:#EEF2FF;border-left:4px solid var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
        .user-bar-name{font-weight:700;color:var(--primary);font-size:1.05rem;}
        .user-bar-actions{display:flex;gap:8px;}
        .small-btn{background:none;border:1px solid var(--primary);color:var(--primary);padding:4px 12px;border-radius:6px;font-size:.8rem;cursor:pointer;font-weight:600;}
        .small-btn.accent{background:var(--primary);color:white;}
        /* Calendar */
        .calendar-wrapper{border-radius:14px;border:1px solid var(--border);overflow:hidden;background:white;}
        .calendar-nav{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#f3f4f6;border-bottom:1px solid var(--border);}
        .nav-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:.82rem;font-weight:600;}
        .current-month{font-weight:700;font-size:1rem;}
        .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:12px;}
        .day-header{text-align:center;font-size:.72rem;font-weight:700;color:var(--text-sub);padding:6px 0;}
        .day-cell{min-height:64px;padding:5px;border-radius:8px;cursor:default;position:relative;font-size:.78rem;}
        .day-num{font-weight:600;font-size:.8rem;margin-bottom:3px;}
        .day-cell.today .day-num{background:var(--primary);color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
        .day-cell.other-month .day-num{color:#d1d5db;}
        .day-cell.sunday .day-num{color:#ef4444;}
        .day-cell.saturday .day-num{color:#3b82f6;}
        .att-chip{font-size:.66rem;padding:1px 4px;border-radius:4px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .chip-ok{background:#D1FAE5;color:#065F46;}
        .chip-in{background:#DBEAFE;color:#1E40AF;}
        .chip-out{background:#FEF3C7;color:#92400E;}
        .chip-anomaly{background:#FEE2E2;color:#991B1B;}
        .chip-holiday{background:#F3E8FF;color:#6D28D9;}
        .chip-preemptive{background:#ECFDF5;color:#065F46;border:1px dashed #10b981;}
        /* Anomaly list */
        .anomaly-item{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:white;}
        .anomaly-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
        .anomaly-date{font-weight:700;font-size:.9rem;color:var(--primary);}
        .reason-badge{background:#FEE2E2;color:#B91C1C;padding:3px 8px;border-radius:6px;font-size:.72rem;font-weight:600;}
        .anomaly-desc{font-size:.82rem;color:var(--text-sub);margin-bottom:10px;}
        .status-badge{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
        .status-request{background:#FFF7ED;color:#C2410C;border:1px solid #FFEDD5;}
        .status-complete{background:#F0FDF4;color:#15803D;border:1px solid #DCFCE7;}
        .explain-area{margin-top:8px;}
        .explain-area textarea{font-size:.85rem;padding:8px;margin-bottom:6px;resize:vertical;}
        .submit-btn{background:var(--primary);color:white;border:none;border-radius:6px;padding:6px 16px;font-size:.82rem;font-weight:600;cursor:pointer;}
        .filter-row{display:flex;gap:6px;justify-content:flex-end;margin-bottom:14px;flex-wrap:wrap;}
        .filter-btn{background:white;border:1px solid var(--border);padding:5px 12px;border-radius:8px;font-size:.8rem;font-weight:600;color:var(--text-sub);cursor:pointer;}
        .filter-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
        /* Preemptive section */
        .prep-section{border-left:4px solid #10b981;background:#f0fdf4;}
        .prep-label{color:#059669;font-size:.95rem;margin-bottom:1rem;display:flex;align-items:center;gap:6px;font-weight:600;}
        .prep-row{display:flex;gap:10px;margin-bottom:10px;}
        .prep-row>div{flex:1;}
        .prep-row label{font-size:.78rem;color:#374151;}
        .prep-row input,.prep-row select{padding:8px;font-size:.85rem;}
        .btn-green{background:#10b981;}
        .btn-green:hover{background:#059669;}
        /* Login */
        #login-screen{width:100%;max-width:400px;margin:0 auto;}
        .login-card{text-align:center;}
        .login-title{font-size:1.4rem;font-weight:700;color:var(--primary);margin-bottom:.4rem;}
        .login-sub{font-size:.85rem;color:var(--text-sub);margin-bottom:1.5rem;}
        .pin-input{letter-spacing:.3rem;text-align:center;font-family:monospace;font-weight:700;font-size:1.2rem;color:var(--primary);}
        .demo-hint{background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:.78rem;color:#92400e;text-align:left;margin-bottom:1rem;}
        .demo-badge{background:#fee2e2;color:#991b1b;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:.8rem;}
        .nav-bar{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100;font-size:.85rem;}
        .nav-logo{font-weight:700;color:var(--primary);}
        .nav-sub{font-size:.75rem;color:var(--text-sub);}
        .preemptive-hist-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:.82rem;display:flex;justify-content:space-between;align-items:center;}
        .hist-date{font-weight:600;color:var(--primary);}
        .hist-type{background:#EEF2FF;color:var(--primary);padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:600;}
        .cancel-hist-btn{background:none;border:1px solid #fca5a5;color:#dc2626;padding:2px 8px;border-radius:6px;font-size:.72rem;cursor:pointer;}
        footer{text-align:center;color:var(--text-sub);font-size:.75rem;padding:2rem 0 1rem;}
        .cal-summary{padding:10px 16px;font-size:.78rem;color:var(--text-sub);border-bottom:1px solid var(--border);background:#fafafa;display:flex;gap:16px;flex-wrap:wrap;}
        .cal-sum-item{display:flex;align-items:center;gap:4px;}
    </style>
</head>
<body>

<div id="login-screen" class="container" style="display:flex;flex-direction:column;justify-content:center;min-height:80vh;">
    <div class="card login-card">
        <span class="demo-badge">DEMO</span>
        <div class="login-title">근태 사유 관리 시스템</div>
        <p class="login-sub">이름과 확인 코드(PIN)를 입력하세요</p>
        <div class="demo-hint">
            <strong>데모 계정</strong><br>
            홍길동 / 1234 &nbsp;|&nbsp; 김영희 / 1234 &nbsp;|&nbsp; 이철수 / 1234<br>
            <span style="color:#7c3aed;">팀장 계정: 박지훈 / 9999</span>
        </div>
        <div style="margin-bottom:1rem;">
            <label>이름</label>
            <input type="text" id="login-name" placeholder="홍길동" autocomplete="off">
        </div>
        <div style="margin-bottom:1.2rem;">
            <label>확인 코드 (PIN)</label>
            <input type="password" id="login-pin" class="pin-input" maxlength="4" placeholder="····" inputmode="numeric"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">확인</button>
    </div>
</div>

<nav class="nav-bar" id="main-nav" style="display:none;">
    <span class="nav-logo">근태 사유 관리 <span style="font-size:.7rem;background:#EEF2FF;color:var(--primary);padding:1px 8px;border-radius:10px;margin-left:6px;">DEMO</span></span>
    <span class="nav-sub" id="nav-username"></span>
</nav>

<div class="container wide" id="main-content" style="display:none;margin-top:60px;">
    <header>
        <h1>근태 사유 관리 시스템</h1>
        <p>외근·출장 등 근태 사유를 미리 등록하거나, 이상 내역에 보완 사유를 제출하세요.</p>
    </header>

    <div id="user-info-bar" class="user-bar">
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="user-bar-name" id="display-name"></span>
            <span style="color:var(--text-sub);font-size:.88rem;">님 접속 중</span>
        </div>
        <div class="user-bar-actions">
            <button class="small-btn" onclick="handleLogout()">로그아웃</button>
        </div>
    </div>

    <div class="main-layout">
        <!-- 왼쪽: 사전 등록 -->
        <div class="left-col">
            <div class="card prep-section">
                <div class="prep-label">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
                    근태 사전 등록
                </div>
                <div class="prep-row">
                    <div>
                        <label>대상 일자</label>
                        <input type="date" id="prep-date">
                    </div>
                    <div>
                        <label>근태 종류</label>
                        <select id="prep-type" onchange="handlePrepTypeChange()">
                            <option value="외근">외근</option>
                            <option value="출장">출장</option>
                            <option value="정상출근">출근 기록 누락</option>
                            <option value="정상퇴근">퇴근 기록 누락</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                </div>
                <div id="prep-company-group" style="margin-bottom:10px;display:none;">
                    <label style="font-size:.78rem;color:#374151;">업체명</label>
                    <input type="text" id="prep-company" placeholder="예: 삼성전자" style="padding:8px;font-size:.85rem;">
                </div>
                <div id="prep-location-group" style="margin-bottom:10px;display:none;">
                    <label style="font-size:.78rem;color:#374151;">지역명</label>
                    <input type="text" id="prep-location" placeholder="예: 부산" style="padding:8px;font-size:.85rem;">
                </div>
                <button class="btn btn-primary btn-green" onclick="handleSubmitPreemptive()">사전 등록하기</button>
            </div>

            <div id="preemptive-hist-section" style="display:none;">
                <div style="font-weight:600;font-size:.88rem;color:var(--text-main);margin-bottom:10px;display:flex;align-items:center;gap:6px;">
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="#4F46E5"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
                    최근 사전 등록 내역
                </div>
                <div id="preemptive-hist-list"></div>
            </div>
        </div>

        <!-- 오른쪽: 탭 -->
        <div class="right-col">
            <div class="tabs-container">
                <button class="tab-btn active" id="tab-calendar" onclick="switchTab('calendar')">나의 근태 달력</button>
                <button class="tab-btn" id="tab-anomalies" onclick="switchTab('anomalies')">보완 요청 내역</button>
            </div>

            <!-- 달력 탭 -->
            <div id="calendar-view">
                <div class="calendar-wrapper">
                    <div class="calendar-nav">
                        <button class="nav-btn" onclick="changeMonth(-1)">이전 달</button>
                        <div class="current-month" id="calendar-title"></div>
                        <button class="nav-btn" onclick="changeMonth(1)">다음 달</button>
                    </div>
                    <div class="cal-summary" id="cal-summary"></div>
                    <div class="calendar-grid" id="calendar-grid">
                        <div class="day-header" style="color:#ef4444;">일</div>
                        <div class="day-header">월</div>
                        <div class="day-header">화</div>
                        <div class="day-header">수</div>
                        <div class="day-header">목</div>
                        <div class="day-header">금</div>
                        <div class="day-header" style="color:#3b82f6;">토</div>
                    </div>
                </div>
            </div>

            <!-- 보완 요청 탭 -->
            <div id="anomalies-view" style="display:none;">
                <div class="filter-row">
                    <button class="filter-btn active" onclick="filterAnomalies('all',this)">전체</button>
                    <button class="filter-btn" onclick="filterAnomalies('request',this)">보완 요청</button>
                    <button class="filter-btn" onclick="filterAnomalies('complete',this)">제출 완료</button>
                </div>
                <div id="anomaly-list"></div>
                <div id="anomaly-empty" style="display:none;text-align:center;color:var(--text-sub);padding:2rem;font-size:.9rem;">보완이 필요한 내역이 없습니다. 🎉</div>
            </div>
        </div>
    </div>
    <footer>© 2026 Intranet Demo — 더미 데이터 기준</footer>
</div>

<script>
const DEMO_USERS = [
    { name:'홍길동', pin:'1234', is_leader:false },
    { name:'김영희', pin:'1234', is_leader:false },
    { name:'이철수', pin:'1234', is_leader:false },
    { name:'박지훈', pin:'9999', is_leader:true },
];

// 더미 근태 기록 (이번 달 기준으로 동적 생성)
function buildDummyRecords(name) {
    const today = new Date();
    const y = today.getFullYear(), m = today.getMonth();
    const records = {};

    const anomalyDays = [3, 11, 18]; // 이상 발생 일자 (일)
    const preemptiveDays = []; // 사전 등록된 날 (동적으로 추가)

    for (let d = 1; d <= today.getDate(); d++) {
        const date = new Date(y, m, d);
        const dow = date.getDay();
        if (dow === 0 || dow === 6) continue; // 주말 제외

        const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (anomalyDays.includes(d)) {
            if (d === 3) records[dateStr] = { in:'08:55', out:null, anomaly:'퇴근 미기록' };
            else if (d === 11) records[dateStr] = { in:null, out:'18:02', anomaly:'출근 미기록' };
            else records[dateStr] = { in:'09:31', out:'18:15', anomaly:'지각' };
        } else {
            // 정상 출퇴근 (약간의 변동)
            const inH = 8 + (d % 2 === 0 ? 0 : 0);
            const inM = 50 + (d * 3) % 10;
            const outH = 17 + (d % 3 === 0 ? 1 : 0);
            const outM = 55 + (d * 7) % 10;
            records[dateStr] = {
                in: `${String(inH).padStart(2,'0')}:${String(inM).padStart(2,'0')}`,
                out: `${String(outH).padStart(2,'0')}:${String(outM).padStart(2,'0')}`,
                anomaly: null
            };
        }
    }
    return records;
}

// 더미 이상 목록
function buildDummyAnomalies() {
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth()+1).padStart(2,'0');
    return [
        { id:'a1', date:`${y}-${m}-03`, type:'퇴근 미기록', desc:'퇴근 시각 기록 없음', status:'complete', explanation:'거래처 방문 후 직귀하였습니다.' },
        { id:'a2', date:`${y}-${m}-11`, type:'출근 미기록', desc:'출근 시각 기록 없음', status:'request', explanation:'' },
        { id:'a3', date:`${y}-${m}-18`, type:'지각', desc:'09:31 출근 (기준 09:00)', status:'request', explanation:'' },
    ];
}

let currentUser = null;
let DEMO_RECORDS = {};
let DEMO_ANOMALIES = [];
let DEMO_PREEMPTIVE = [];
let calYear, calMonth;
let currentAnomalyFilter = 'all';

function handleLogin() {
    const name = document.getElementById('login-name').value.trim();
    const pin = document.getElementById('login-pin').value.trim();
    const user = DEMO_USERS.find(u => u.name === name && u.pin === pin);
    if (!user) { alert('이름 또는 확인 코드가 올바르지 않습니다.'); return; }
    currentUser = user;
    DEMO_RECORDS = buildDummyRecords(user.name);
    DEMO_ANOMALIES = buildDummyAnomalies();
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth() + 1;
    // Set default prep date to tomorrow
    const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
    document.getElementById('prep-date').value = tomorrow.toISOString().split('T')[0];
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-nav').style.display = 'flex';
    document.getElementById('main-content').style.display = 'block';
    document.getElementById('display-name').textContent = user.name;
    document.getElementById('nav-username').textContent = user.name + ' 님';
    renderCalendar();
    renderAnomalies();
    renderPreemptiveHist();
    handlePrepTypeChange();
}

function handleLogout() {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-nav').style.display = 'none';
    document.getElementById('main-content').style.display = 'none';
    document.getElementById('login-name').value = '';
    document.getElementById('login-pin').value = '';
}

function switchTab(tab) {
    document.getElementById('calendar-view').style.display = tab === 'calendar' ? 'block' : 'none';
    document.getElementById('anomalies-view').style.display = tab === 'anomalies' ? 'block' : 'none';
    document.getElementById('tab-calendar').classList.toggle('active', tab === 'calendar');
    document.getElementById('tab-anomalies').classList.toggle('active', tab === 'anomalies');
}

function changeMonth(delta) {
    calMonth += delta;
    if (calMonth > 12) { calMonth = 1; calYear++; }
    if (calMonth < 1) { calMonth = 12; calYear--; }
    renderCalendar();
}

function renderCalendar() {
    const y = calYear, m = calMonth;
    document.getElementById('calendar-title').textContent = `${y}년 ${String(m).padStart(2,'0')}월`;

    const firstDay = new Date(y, m-1, 1).getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const today = new Date();

    // Count stats
    let normalDays = 0, anomalyDays = 0;
    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const rec = DEMO_RECORDS[dateStr];
        if (!rec) continue;
        if (rec.anomaly) anomalyDays++;
        else normalDays++;
    }

    const summary = document.getElementById('cal-summary');
    summary.innerHTML = `
        <div class="cal-sum-item"><span style="width:10px;height:10px;background:#D1FAE5;border-radius:3px;display:inline-block;"></span> 정상 ${normalDays}일</div>
        <div class="cal-sum-item"><span style="width:10px;height:10px;background:#FEE2E2;border-radius:3px;display:inline-block;"></span> 이상 ${anomalyDays}일</div>
        <div class="cal-sum-item"><span style="width:10px;height:10px;background:#ECFDF5;border:1px dashed #10b981;border-radius:3px;display:inline-block;"></span> 사전등록 ${DEMO_PREEMPTIVE.filter(p=>p.date.startsWith(`${y}-${String(m).padStart(2,'0')}`)).length}건</div>
    `;

    const grid = document.getElementById('calendar-grid');
    // Keep day headers (first 7 children)
    const headers = Array.from(grid.children).slice(0, 7);
    grid.innerHTML = '';
    headers.forEach(h => grid.appendChild(h));

    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        const prevMonthDays = new Date(y, m-1, 0).getDate();
        cell.innerHTML = `<div class="day-num">${prevMonthDays - firstDay + 1 + i}</div>`;
        grid.appendChild(cell);
    }

    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dow = new Date(y, m-1, d).getDay();
        const isToday = today.getFullYear()===y && today.getMonth()+1===m && today.getDate()===d;
        const rec = DEMO_RECORDS[dateStr];
        const prep = DEMO_PREEMPTIVE.find(p => p.date === dateStr);
        const isWeekend = dow===0 || dow===6;

        const cell = document.createElement('div');
        cell.className = `day-cell${isToday?' today':''}${dow===0?' sunday':dow===6?' saturday':''}`;

        let chips = '';
        if (isWeekend) {
            chips = `<span class="att-chip" style="background:#f3f4f6;color:#9ca3af;">휴일</span>`;
        } else if (prep) {
            chips = `<span class="att-chip chip-preemptive">📋 ${prep.type}</span>`;
        } else if (rec) {
            if (rec.anomaly) {
                chips = `<span class="att-chip chip-anomaly">⚠ ${rec.anomaly}</span>`;
                if (rec.in) chips += `<span class="att-chip chip-in">↑${rec.in}</span>`;
                if (rec.out) chips += `<span class="att-chip chip-out">↓${rec.out}</span>`;
            } else {
                chips = `<span class="att-chip chip-in">↑${rec.in}</span><span class="att-chip chip-out">↓${rec.out}</span>`;
            }
        } else if (d < today.getDate() || m < today.getMonth()+1 || y < today.getFullYear()) {
            chips = `<span class="att-chip" style="background:#f3f4f6;color:#9ca3af;">기록없음</span>`;
        }

        cell.innerHTML = `<div class="day-num">${d}</div>${chips}`;
        grid.appendChild(cell);
    }

    // Fill remaining cells
    const totalCells = firstDay + daysInMonth;
    const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for (let i = 1; i <= remaining; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        cell.innerHTML = `<div class="day-num">${i}</div>`;
        grid.appendChild(cell);
    }
}

function renderAnomalies() {
    const list = document.getElementById('anomaly-list');
    const empty = document.getElementById('anomaly-empty');
    let filtered = DEMO_ANOMALIES;
    if (currentAnomalyFilter === 'request') filtered = DEMO_ANOMALIES.filter(a => a.status === 'request');
    if (currentAnomalyFilter === 'complete') filtered = DEMO_ANOMALIES.filter(a => a.status === 'complete');

    if (!filtered.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    list.innerHTML = filtered.map(a => `
        <div class="anomaly-item" id="aitem-${a.id}">
            <div class="anomaly-header">
                <span class="anomaly-date">${a.date}</span>
                <span class="reason-badge">${a.type}</span>
            </div>
            <div class="anomaly-desc">${a.desc}</div>
            ${a.status === 'complete' ? `
                <div><span class="status-badge status-complete">✓ 제출 완료</span></div>
                <div style="margin-top:6px;font-size:.8rem;color:var(--text-sub);">${a.explanation}</div>
            ` : `
                <div class="explain-area">
                    <textarea id="exp-${a.id}" rows="2" placeholder="보완 사유를 입력하세요...">${a.explanation}</textarea>
                    <button class="submit-btn" onclick="submitExplanation('${a.id}')">사유 제출</button>
                </div>
                <div><span class="status-badge status-request">⏳ 보완 요청</span></div>
            `}
        </div>
    `).join('');
}

function filterAnomalies(f, btn) {
    currentAnomalyFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAnomalies();
}

function submitExplanation(id) {
    const textarea = document.getElementById('exp-' + id);
    const text = textarea ? textarea.value.trim() : '';
    if (!text) { alert('보완 사유를 입력해 주세요.'); return; }
    const anomaly = DEMO_ANOMALIES.find(a => a.id === id);
    if (anomaly) { anomaly.status = 'complete'; anomaly.explanation = text; }
    renderAnomalies();
    // Also update calendar chip
    renderCalendar();
}

function handlePrepTypeChange() {
    const type = document.getElementById('prep-type').value;
    document.getElementById('prep-company-group').style.display = type === '외근' ? 'block' : 'none';
    document.getElementById('prep-location-group').style.display = type === '출장' ? 'block' : 'none';
}

function handleSubmitPreemptive() {
    const date = document.getElementById('prep-date').value;
    const type = document.getElementById('prep-type').value;
    if (!date) { alert('날짜를 선택해 주세요.'); return; }
    if (DEMO_PREEMPTIVE.find(p => p.date === date)) {
        alert('이미 해당 날짜에 사전 등록이 있습니다.');
        return;
    }
    let detail = '';
    if (type === '외근') detail = document.getElementById('prep-company').value;
    if (type === '출장') detail = document.getElementById('prep-location').value;
    DEMO_PREEMPTIVE.push({ id:'p'+Date.now(), date, type, detail });
    renderPreemptiveHist();
    renderCalendar();
    alert(`${date} — ${type} 사전 등록 완료!`);
    document.getElementById('prep-company').value = '';
    document.getElementById('prep-location').value = '';
}

function renderPreemptiveHist() {
    const section = document.getElementById('preemptive-hist-section');
    const list = document.getElementById('preemptive-hist-list');
    if (!DEMO_PREEMPTIVE.length) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = [...DEMO_PREEMPTIVE].reverse().slice(0,5).map(p => `
        <div class="preemptive-hist-item">
            <div>
                <span class="hist-date">${p.date}</span>
                ${p.detail ? `<span style="font-size:.78rem;color:var(--text-sub);margin-left:6px;">${p.detail}</span>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <span class="hist-type">${p.type}</span>
                <button class="cancel-hist-btn" onclick="cancelPreemptive('${p.id}')">취소</button>
            </div>
        </div>
    `).join('');
}

function cancelPreemptive(id) {
    DEMO_PREEMPTIVE = DEMO_PREEMPTIVE.filter(p => p.id !== id);
    renderPreemptiveHist();
    renderCalendar();
}
</script>
</body>
</html>
