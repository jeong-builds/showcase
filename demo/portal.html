<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결재 시스템 — Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #f5f5f7; --surface: #ffffff;
    --border: rgba(0,0,0,0.08); --border-mid: rgba(0,0,0,0.14);
    --text: #1d1d1f; --text-sub: #6e6e73;
    --blue: #0071e3; --radius: 18px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAV */
nav {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; z-index: 100;
}
.nav-left { display: flex; align-items: center; gap: 14px; }
.nav-logo { font-size: 0.95rem; font-weight: 700; }
.nav-logo span { color: var(--blue); }
.demo-badge { background: #fee2e2; color: #991b1b; font-size: 0.68rem; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
.nav-back { font-size: 0.82rem; color: var(--text-sub); text-decoration: none; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); }
.nav-back:hover { background: #f3f4f6; }
.nav-user { font-size: 0.82rem; color: var(--text-sub); display: flex; align-items: center; gap: 10px; }
.nav-user button { background: none; border: 1px solid var(--border); padding: 3px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; color: var(--text-sub); font-family: inherit; }

main { max-width: 720px; margin: 0 auto; padding: 80px 22px 60px; }

.page-title { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.25rem; }
.page-sub { font-size: 0.88rem; color: var(--text-sub); margin-bottom: 2rem; }

/* TABS */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.8rem; }
.tab { padding: 10px 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: var(--text-sub); border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* TYPE GRID */
.type-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 24px; }
@media (max-width: 540px) { .type-grid { grid-template-columns: 1fr 1fr; } }
.type-card {
    border: 1.5px solid var(--border); border-radius: 14px;
    padding: 16px 10px; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    text-align: center; background: var(--surface);
}
.type-card:hover { border-color: var(--blue); }
.type-card.selected { border-color: var(--blue); background: #eff6ff; }
.type-card-icon { font-size: 1.5rem; margin-bottom: 7px; }
.type-card-label { font-size: 0.75rem; font-weight: 600; color: var(--text); line-height: 1.3; }

/* FORM */
.ap-form { display: none; }
.ap-form.visible { display: block; }
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.6rem; }
.ap-field { margin-bottom: 14px; }
.ap-field label { display: block; font-size: 0.79rem; font-weight: 600; color: var(--text-sub); margin-bottom: 5px; }
.ap-field input, .ap-field select, .ap-field textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 0.88rem; font-family: inherit; outline: none;
    transition: border-color 0.2s; background: #fff;
}
.ap-field input:focus, .ap-field select:focus, .ap-field textarea:focus { border-color: var(--blue); }
.ap-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ap-amount-total { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; font-weight: 600; color: #065f46; margin-bottom: 14px; }

/* Item table (비품구매) */
.item-table-wrap { overflow-x: auto; margin-bottom: 10px; }
.item-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.item-table th { background: #f3f4f6; padding: 7px 8px; font-weight: 600; color: var(--text-sub); border: 1px solid var(--border-mid); text-align: center; }
.item-table td { border: 1px solid var(--border-mid); padding: 3px 4px; }
.item-table td input { width: 100%; border: none; outline: none; padding: 5px 6px; font-size: 0.82rem; font-family: inherit; background: transparent; }
.item-table td input:focus { background: #f0f9ff; border-radius: 4px; }
.btn-add-item { margin-top: 6px; background: none; border: 1px dashed var(--border-mid); border-radius: 7px; padding: 6px 14px; font-size: 0.8rem; color: var(--text-sub); cursor: pointer; width: 100%; font-family: inherit; }
.btn-add-item:hover { border-color: var(--blue); color: var(--blue); }
.btn-remove-item { background: none; border: none; cursor: pointer; color: #dc2626; font-size: 1rem; padding: 2px 4px; }

.btn-preview {
    width: 100%; background: var(--blue); color: #fff; border: none;
    border-radius: 10px; padding: 13px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; margin-top: 4px; transition: opacity 0.2s; font-family: inherit;
}
.btn-preview:hover { opacity: 0.88; }

/* PREVIEW MODAL */
.preview-backdrop { display: none; position: fixed; inset: 0; background: #3a3a3c; z-index: 300; overflow-y: auto; padding: 60px 20px 20px; }
.preview-backdrop.open { display: block; }
.preview-toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: #1c1c1e; display: flex; align-items: center;
    justify-content: space-between; padding: 0 24px; z-index: 301;
}
.preview-toolbar-title { color: #fff; font-size: 0.88rem; font-weight: 600; }
.preview-toolbar-btns { display: flex; gap: 10px; }
.btn-cancel { background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 8px; padding: 7px 18px; font-size: 0.83rem; cursor: pointer; font-family: inherit; }
.btn-cancel:hover { background: rgba(255,255,255,0.2); }
.btn-submit-final { background: #0071e3; color: #fff; border: none; border-radius: 8px; padding: 7px 20px; font-size: 0.83rem; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-submit-final:hover { opacity: 0.88; }

/* A4 */
.a4-wrap { display: flex; justify-content: center; }
.a4-page { background: #fff; width: 595px; min-height: 500px; padding: 48px 52px; box-shadow: 0 4px 32px rgba(0,0,0,0.35); font-family: 'Noto Sans KR', sans-serif; color: #111; font-size: 10pt; line-height: 1.5; }
.doc-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.doc-logo { font-size: 9pt; font-weight: 700; color: #0071e3; letter-spacing: 0.05em; }
.doc-approve-box { display: flex; border: 1px solid #333; }
.doc-approve-cell { width: 58px; text-align: center; font-size: 8pt; border-left: 1px solid #333; }
.doc-approve-cell:first-child { border-left: none; }
.doc-approve-cell-label { background: #f3f4f6; padding: 3px 0; font-weight: 700; border-bottom: 1px solid #333; }
.doc-approve-cell-sign { height: 44px; }
.doc-title-wrap { text-align: center; margin: 16px 0 20px; }
.doc-title { font-size: 16pt; font-weight: 700; letter-spacing: 0.08em; border-bottom: 2px solid #111; display: inline-block; padding-bottom: 4px; }
.doc-meta-row { display: flex; justify-content: flex-end; gap: 24px; font-size: 9pt; color: #444; margin-bottom: 20px; }
.doc-table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin-bottom: 12px; }
.doc-table th { background: #f3f4f6; padding: 6px 10px; font-weight: 700; border: 1px solid #555; text-align: center; white-space: nowrap; }
.doc-table td { padding: 6px 10px; border: 1px solid #555; vertical-align: middle; }
.doc-table td.label { background: #f9fafb; font-weight: 600; text-align: center; width: 80px; white-space: nowrap; }
.doc-table td.total { background: #f0fdf4; font-weight: 700; color: #065f46; text-align: right; }
.doc-table td.amount { font-weight: 700; color: #0071e3; }
.doc-footer { margin-top: 40px; text-align: center; font-size: 8pt; color: #888; border-top: 1px solid #ddd; padding-top: 10px; }

/* LIST */
.ap-list-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 0.78rem; font-weight: 600; cursor: pointer; background: #fff; color: var(--text-sub); font-family: inherit; }
.filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.ap-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.ap-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.ap-item-title { font-size: 0.9rem; font-weight: 700; }
.ap-badge { font-size: 0.7rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
.badge-pending { background: #fef3c7; color: #92400e; }
.badge-approved { background: #d1fae5; color: #065f46; }
.badge-rejected { background: #fee2e2; color: #991b1b; }
.ap-item-meta { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 8px; }
.ap-item-actions { display: flex; gap: 8px; }
.btn-approve { flex: 1; padding: 7px; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: #d1fae5; color: #065f46; font-family: inherit; }
.btn-reject { flex: 1; padding: 7px; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: #fee2e2; color: #991b1b; font-family: inherit; }
.empty-msg { text-align: center; color: var(--text-sub); padding: 40px 0; font-size: 0.88rem; }

/* TOAST */
.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1d1d1f; color: #fff; padding: 12px 24px; border-radius: 24px; font-size: 0.88rem; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Demo hint */
.demo-hint { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 10px 14px; font-size: 0.8rem; color: #1e40af; margin-bottom: 20px; }

@media (max-width: 600px) { .page-title { font-size: 1.4rem; } .a4-page { width: 100%; padding: 32px 24px; } }
</style>
</head>
<body>

<nav>
    <div class="nav-left">
        <span class="nav-logo">DOW <span>결재</span></span>
        <span class="demo-badge">DEMO</span>
        <a class="nav-back" href="../index.html">← 포트폴리오</a>
    </div>
    <div class="nav-user">
        <span id="nav-username">—</span>
        <button onclick="onLoginLogout()">로그인</button>
    </div>
</nav>

<main>
    <h1 class="page-title">결재 시스템</h1>
    <p class="page-sub">비품구매 · 경조사비 · 출장비 · 식비 · 품의서 5종 신청 및 처리</p>

    <div class="demo-hint">
        💡 데모 계정 — 일반: 이름 <strong>홍길동</strong> / PIN <strong>1234</strong> &nbsp;|&nbsp; 관리자: 이름 <strong>관리자</strong> / PIN <strong>0000</strong> (승인·반려 가능)
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('submit', this)">신청하기</div>
        <div class="tab" onclick="switchTab('list', this)">결재 현황</div>
    </div>

    <!-- 신청하기 -->
    <div id="pane-submit">
        <div class="type-grid">
            <div class="type-card" onclick="selectType('비품구매', this)">
                <div class="type-card-icon">🛒</div>
                <div class="type-card-label">비품·소모품</div>
            </div>
            <div class="type-card" onclick="selectType('경조사비', this)">
                <div class="type-card-icon">🌸</div>
                <div class="type-card-label">경조사비</div>
            </div>
            <div class="type-card" onclick="selectType('출장비', this)">
                <div class="type-card-icon">✈️</div>
                <div class="type-card-label">출장비 신청</div>
            </div>
            <div class="type-card" onclick="selectType('식비', this)">
                <div class="type-card-icon">🍽️</div>
                <div class="type-card-label">식비 사용내역</div>
            </div>
            <div class="type-card" onclick="selectType('품의서', this)">
                <div class="type-card-icon">📋</div>
                <div class="type-card-label">품의서</div>
            </div>
        </div>

        <!-- 비품구매 -->
        <div class="ap-form" id="form-비품구매">
            <div class="form-card">
                <div class="ap-field">
                    <label>구매 구분</label>
                    <select id="f-category"><option>소모품</option><option>고정자산(비품)</option></select>
                </div>
                <div class="item-table-wrap">
                    <table class="item-table" id="item-table">
                        <thead><tr><th>품목명</th><th>규격</th><th>수량</th><th>단가(원)</th><th>금액(원)</th><th></th></tr></thead>
                        <tbody id="item-tbody">
                            <tr>
                                <td><input type="text" placeholder="예) A4 용지" oninput="calcItems()"></td>
                                <td><input type="text" placeholder="500매 1박스" oninput="calcItems()"></td>
                                <td><input type="number" placeholder="1" min="1" style="width:60px;" oninput="calcItems()"></td>
                                <td><input type="number" placeholder="0" oninput="calcItems()"></td>
                                <td id="row-amt-0">—</td>
                                <td><button class="btn-remove-item" onclick="removeItem(this)">✕</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <button class="btn-add-item" onclick="addItem()">+ 품목 추가</button>
                <div class="ap-amount-total" id="item-total" style="margin-top:10px;">합계: 0 원</div>
                <div class="ap-field"><label>구매 사유</label><input type="text" id="f-purchase-reason" placeholder="예) 사무용 소모품 보충"></div>
                <div class="ap-field"><label>구매 링크 (선택)</label><input type="text" id="f-link" placeholder="https://..."></div>
                <button class="btn-preview" onclick="previewForm('비품구매')">미리보기 후 신청 →</button>
            </div>
        </div>

        <!-- 경조사비 -->
        <div class="ap-form" id="form-경조사비">
            <div class="form-card">
                <div class="ap-field"><label>경조 사유</label><select id="f-reason"><option>결혼</option><option>출산</option><option>부친상</option><option>모친상</option><option>기타</option></select></div>
                <div class="ap-field"><label>대상자 (성명)</label><input type="text" id="f-recipient" placeholder="예) 홍길동"></div>
                <div class="ap-field"><label>관계</label><input type="text" id="f-relation" placeholder="예) 직계존속"></div>
                <div class="ap-field"><label>신청 금액 (원)</label><input type="number" id="f-amount-condolence" placeholder="0"></div>
                <button class="btn-preview" onclick="previewForm('경조사비')">미리보기 후 신청 →</button>
            </div>
        </div>

        <!-- 출장비 -->
        <div class="ap-form" id="form-출장비">
            <div class="form-card">
                <div class="ap-field"><label>출장지</label><input type="text" id="f-destination" placeholder="예) 부산"></div>
                <div class="ap-field"><label>출장 목적</label><input type="text" id="f-purpose" placeholder="예) 고객사 방문"></div>
                <div class="ap-field-row">
                    <div class="ap-field"><label>출장 시작일</label><input type="date" id="f-date-from"></div>
                    <div class="ap-field"><label>출장 종료일</label><input type="date" id="f-date-to"></div>
                </div>
                <div class="ap-field-row">
                    <div class="ap-field"><label>교통비 (원)</label><input type="number" id="f-transport" placeholder="0" oninput="calcTrip()"></div>
                    <div class="ap-field"><label>숙박비 (원)</label><input type="number" id="f-accommodation" placeholder="0" oninput="calcTrip()"></div>
                </div>
                <div class="ap-field"><label>기타 경비 (원)</label><input type="number" id="f-etc" placeholder="0" oninput="calcTrip()"></div>
                <div class="ap-amount-total" id="trip-total">합계: 0 원</div>
                <button class="btn-preview" onclick="previewForm('출장비')">미리보기 후 신청 →</button>
            </div>
        </div>

        <!-- 식비 -->
        <div class="ap-form" id="form-식비">
            <div class="form-card">
                <div class="ap-field"><label>사용 일자</label><input type="date" id="f-meal-date"></div>
                <div class="ap-field"><label>사용처</label><input type="text" id="f-place" placeholder="예) 한우마을 강남점"></div>
                <div class="ap-field-row">
                    <div class="ap-field"><label>참석 인원</label><input type="number" id="f-headcount" placeholder="1" min="1"></div>
                    <div class="ap-field"><label>금액 (원)</label><input type="number" id="f-amount-meal" placeholder="0"></div>
                </div>
                <div class="ap-field"><label>목적</label><select id="f-meal-purpose"><option>거래처 접대</option><option>팀 회식</option><option>사내 미팅</option><option>기타</option></select></div>
                <button class="btn-preview" onclick="previewForm('식비')">미리보기 후 신청 →</button>
            </div>
        </div>

        <!-- 품의서 -->
        <div class="ap-form" id="form-품의서">
            <div class="form-card">
                <div class="ap-field"><label>제목</label><input type="text" id="f-proposal-title" placeholder="예) 신규 거래처 계약 검토 건"></div>
                <div class="ap-field"><label>목적 및 배경</label><textarea id="f-proposal-bg" rows="3" placeholder="추진 목적과 배경을 입력하세요"></textarea></div>
                <div class="ap-field"><label>주요 내용</label><textarea id="f-proposal-body" rows="4" placeholder="주요 내용을 입력하세요"></textarea></div>
                <div class="ap-field"><label>예산 (원, 선택)</label><input type="number" id="f-proposal-budget" placeholder="0"></div>
                <button class="btn-preview" onclick="previewForm('품의서')">미리보기 후 신청 →</button>
            </div>
        </div>
    </div>

    <!-- 결재 현황 -->
    <div id="pane-list" style="display:none;">
        <div class="ap-list-filter">
            <button class="filter-btn active" onclick="filterList('all',this)">전체</button>
            <button class="filter-btn" onclick="filterList('pending',this)">대기</button>
            <button class="filter-btn" onclick="filterList('approved',this)">승인</button>
            <button class="filter-btn" onclick="filterList('rejected',this)">반려</button>
        </div>
        <div id="ap-list-container"></div>
    </div>
</main>

<!-- A4 미리보기 -->
<div class="preview-backdrop" id="preview-backdrop">
    <div class="preview-toolbar">
        <span class="preview-toolbar-title">📄 결재 문서 미리보기</span>
        <div class="preview-toolbar-btns">
            <button class="btn-cancel" onclick="closePreview()">취소</button>
            <button class="btn-submit-final" onclick="submitApproval()">신청하기</button>
        </div>
    </div>
    <div class="a4-wrap">
        <div class="a4-page" id="a4-content"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 데이터 ───────────────────────────────────────────────
const DEMO_USERS = [
    { name:'홍길동', pin:'1234', is_admin:false },
    { name:'이서연', pin:'1234', is_admin:false },
    { name:'관리자', pin:'0000', is_admin:true },
];

let DEMO_APPROVALS = [
    { id:'d1', type:'비품구매', applicant:'홍길동', summary:'A4 용지 2박스', amount:18000, status:'approved', date:'2026-04-10', note:'' },
    { id:'d2', type:'출장비', applicant:'이서연', summary:'부산 고객사 방문 (04/15~16)', amount:140000, status:'pending', date:'2026-04-18', note:'' },
    { id:'d3', type:'식비', applicant:'홍길동', summary:'거래처 접대 — 참이슬한우집', amount:320000, status:'rejected', date:'2026-04-17', note:'영수증 첨부 필요' },
    { id:'d4', type:'경조사비', applicant:'이서연', summary:'결혼 / 박민준', amount:100000, status:'pending', date:'2026-04-19', note:'' },
    { id:'d5', type:'품의서', applicant:'홍길동', summary:'신규 공급사 계약 검토 건', amount:0, status:'pending', date:'2026-04-22', note:'' },
];

let nextId = 6;
let currentType = null;
let listFilter = 'all';
let demoUser = null;
let pendingApproval = null;

// ── 초기화 ───────────────────────────────────────────────
(function() {
    const saved = sessionStorage.getItem('demo_ap_user');
    if (saved) {
        demoUser = JSON.parse(saved);
        document.getElementById('nav-username').textContent = demoUser.name + (demoUser.is_admin ? ' (관리자)' : '');
    }
})();

// ── 유틸 ─────────────────────────────────────────────────
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
}
function fmt(n) { return Number(n||0).toLocaleString(); }

// ── 탭 ───────────────────────────────────────────────────
function switchTab(tab, el) {
    document.getElementById('pane-submit').style.display = tab === 'submit' ? '' : 'none';
    document.getElementById('pane-list').style.display = tab === 'list' ? '' : 'none';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if (tab === 'list') { if (!demoUser) { showToast('먼저 로그인해주세요.'); switchTab('submit', document.querySelector('.tab')); return; } loadList(); }
}

// ── 타입 선택 ─────────────────────────────────────────────
function selectType(type, card) {
    currentType = type;
    document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    document.querySelectorAll('.ap-form').forEach(f => f.classList.remove('visible'));
    document.getElementById('form-' + type).classList.add('visible');
}

// ── 비품구매 item table ───────────────────────────────────
let itemRowCount = 1;
function addItem() {
    const tbody = document.getElementById('item-tbody');
    const idx = itemRowCount++;
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="text" placeholder="품목명" oninput="calcItems()"></td>
        <td><input type="text" placeholder="규격" oninput="calcItems()"></td>
        <td><input type="number" placeholder="1" min="1" style="width:60px;" oninput="calcItems()"></td>
        <td><input type="number" placeholder="0" oninput="calcItems()"></td>
        <td id="row-amt-${idx}">—</td>
        <td><button class="btn-remove-item" onclick="removeItem(this)">✕</button></td>`;
    tbody.appendChild(tr);
}
function removeItem(btn) {
    const row = btn.closest('tr');
    if (document.getElementById('item-tbody').rows.length <= 1) return;
    row.remove(); calcItems();
}
function calcItems() {
    let total = 0;
    document.getElementById('item-tbody').querySelectorAll('tr').forEach((tr, i) => {
        const inputs = tr.querySelectorAll('input');
        const qty = Number(inputs[2].value) || 0;
        const price = Number(inputs[3].value) || 0;
        const amt = qty * price;
        total += amt;
        const amtCell = tr.querySelector('td:nth-child(5)');
        if (amtCell) amtCell.textContent = amt ? fmt(amt) : '—';
    });
    document.getElementById('item-total').textContent = '합계: ' + fmt(total) + ' 원';
}
function calcTrip() {
    const t = Number(document.getElementById('f-transport').value)||0;
    const a = Number(document.getElementById('f-accommodation').value)||0;
    const e = Number(document.getElementById('f-etc').value)||0;
    document.getElementById('trip-total').textContent = '합계: ' + fmt(t+a+e) + ' 원';
}

// ── 미리보기 ─────────────────────────────────────────────
function previewForm(type) {
    if (!demoUser) { showToast('먼저 로그인해주세요.'); return; }

    let summary = '', amount = 0, bodyHtml = '';
    const today = new Date().toLocaleDateString('ko-KR');

    if (type === '비품구매') {
        let rows = '', total = 0;
        document.getElementById('item-tbody').querySelectorAll('tr').forEach(tr => {
            const inputs = tr.querySelectorAll('input');
            const item = inputs[0].value || '(미입력)';
            const spec = inputs[1].value || '';
            const qty = Number(inputs[2].value)||0;
            const price = Number(inputs[3].value)||0;
            const amt = qty * price;
            total += amt;
            rows += `<tr><td>${item}</td><td>${spec}</td><td style="text-align:center;">${qty}</td><td style="text-align:right;">${fmt(price)}</td><td class="amount" style="text-align:right;">${fmt(amt)}</td></tr>`;
        });
        amount = total;
        summary = document.getElementById('item-tbody').querySelector('input').value || '품목';
        bodyHtml = `
            <table class="doc-table">
                <thead><tr><th>품목명</th><th>규격</th><th>수량</th><th>단가</th><th>금액</th></tr></thead>
                <tbody>${rows}<tr><td colspan="4" class="label">합계</td><td class="total">${fmt(total)} 원</td></tr></tbody>
            </table>
            <table class="doc-table"><tbody>
                <tr><td class="label">구매 사유</td><td>${document.getElementById('f-purchase-reason').value||'—'}</td></tr>
            </tbody></table>`;
    } else if (type === '경조사비') {
        amount = Number(document.getElementById('f-amount-condolence').value)||0;
        summary = document.getElementById('f-reason').value + ' / ' + (document.getElementById('f-recipient').value||'—');
        bodyHtml = `<table class="doc-table"><tbody>
            <tr><td class="label">경조 사유</td><td>${document.getElementById('f-reason').value}</td></tr>
            <tr><td class="label">대상자</td><td>${document.getElementById('f-recipient').value||'—'}</td></tr>
            <tr><td class="label">관계</td><td>${document.getElementById('f-relation').value||'—'}</td></tr>
            <tr><td class="label">신청 금액</td><td class="amount">${fmt(amount)} 원</td></tr>
        </tbody></table>`;
    } else if (type === '출장비') {
        const t = Number(document.getElementById('f-transport').value)||0;
        const a = Number(document.getElementById('f-accommodation').value)||0;
        const e = Number(document.getElementById('f-etc').value)||0;
        amount = t+a+e;
        const dest = document.getElementById('f-destination').value||'—';
        summary = dest + ' ' + (document.getElementById('f-date-from').value||'');
        bodyHtml = `<table class="doc-table"><tbody>
            <tr><td class="label">출장지</td><td>${dest}</td></tr>
            <tr><td class="label">목적</td><td>${document.getElementById('f-purpose').value||'—'}</td></tr>
            <tr><td class="label">기간</td><td>${document.getElementById('f-date-from').value||'—'} ~ ${document.getElementById('f-date-to').value||'—'}</td></tr>
            <tr><td class="label">교통비</td><td>${fmt(t)} 원</td></tr>
            <tr><td class="label">숙박비</td><td>${fmt(a)} 원</td></tr>
            <tr><td class="label">기타</td><td>${fmt(e)} 원</td></tr>
            <tr><td class="label">합계</td><td class="amount">${fmt(amount)} 원</td></tr>
        </tbody></table>`;
    } else if (type === '식비') {
        amount = Number(document.getElementById('f-amount-meal').value)||0;
        const place = document.getElementById('f-place').value||'—';
        summary = document.getElementById('f-meal-purpose').value + ' — ' + place;
        bodyHtml = `<table class="doc-table"><tbody>
            <tr><td class="label">사용 일자</td><td>${document.getElementById('f-meal-date').value||'—'}</td></tr>
            <tr><td class="label">사용처</td><td>${place}</td></tr>
            <tr><td class="label">참석 인원</td><td>${document.getElementById('f-headcount').value||'—'} 명</td></tr>
            <tr><td class="label">금액</td><td class="amount">${fmt(amount)} 원</td></tr>
            <tr><td class="label">목적</td><td>${document.getElementById('f-meal-purpose').value}</td></tr>
        </tbody></table>`;
    } else if (type === '품의서') {
        const title = document.getElementById('f-proposal-title').value||'—';
        const budget = Number(document.getElementById('f-proposal-budget').value)||0;
        amount = budget;
        summary = title;
        bodyHtml = `<table class="doc-table"><tbody>
            <tr><td class="label">제목</td><td>${title}</td></tr>
            <tr><td class="label">목적·배경</td><td>${document.getElementById('f-proposal-bg').value||'—'}</td></tr>
            <tr><td class="label">주요 내용</td><td>${document.getElementById('f-proposal-body').value||'—'}</td></tr>
            ${budget ? `<tr><td class="label">예산</td><td class="amount">${fmt(budget)} 원</td></tr>` : ''}
        </tbody></table>`;
    }

    pendingApproval = { type, summary, amount };

    const typeLabels = { '비품구매':'구매결재서', '경조사비':'경조사비 신청서', '출장비':'출장비 신청서', '식비':'식비 사용 내역서', '품의서':'품의서' };
    document.getElementById('a4-content').innerHTML = `
        <div class="doc-header">
            <div class="doc-logo">DOW VALVE</div>
            <div class="doc-approve-box">
                <div class="doc-approve-cell"><div class="doc-approve-cell-label">담당</div><div class="doc-approve-cell-sign"></div></div>
                <div class="doc-approve-cell"><div class="doc-approve-cell-label">팀장</div><div class="doc-approve-cell-sign"></div></div>
                <div class="doc-approve-cell"><div class="doc-approve-cell-label">부장</div><div class="doc-approve-cell-sign"></div></div>
                <div class="doc-approve-cell"><div class="doc-approve-cell-label">대표</div><div class="doc-approve-cell-sign"></div></div>
            </div>
        </div>
        <div class="doc-title-wrap"><span class="doc-title">${typeLabels[type]}</span></div>
        <div class="doc-meta-row"><span>신청일: ${today}</span><span>신청자: ${demoUser.name}</span></div>
        ${bodyHtml}
        <div class="doc-footer">다우밸브 주식회사</div>`;

    document.getElementById('preview-backdrop').classList.add('open');
}

function closePreview() { document.getElementById('preview-backdrop').classList.remove('open'); }

function submitApproval() {
    if (!pendingApproval) return;
    DEMO_APPROVALS.unshift({
        id: 'd' + (nextId++),
        type: pendingApproval.type,
        applicant: demoUser.name,
        summary: pendingApproval.summary,
        amount: pendingApproval.amount,
        status: 'pending',
        date: new Date().toLocaleDateString('ko-KR'),
        note: ''
    });
    closePreview();
    showToast('✅ 결재 신청이 완료됐습니다.');
    pendingApproval = null;
}

// ── 결재 현황 ─────────────────────────────────────────────
function loadList() {
    const container = document.getElementById('ap-list-container');
    let list = DEMO_APPROVALS;
    if (listFilter !== 'all') list = list.filter(r => r.status === listFilter);
    if (!demoUser?.is_admin) list = list.filter(r => r.applicant === demoUser?.name);
    if (!list.length) { container.innerHTML = '<p class="empty-msg">내역이 없습니다.</p>'; return; }

    const sLabel = { pending:'대기', approved:'승인', rejected:'반려' };
    const sBadge = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected' };
    container.innerHTML = list.map(item => {
        const actions = (demoUser?.is_admin && item.status === 'pending')
            ? `<div class="ap-item-actions"><button class="btn-approve" onclick="decide('${item.id}','approved')">승인</button><button class="btn-reject" onclick="decide('${item.id}','rejected')">반려</button></div>`
            : item.status === 'rejected' && item.note
                ? `<p style="font-size:.77rem;color:#991b1b;margin-top:4px;">반려 사유: ${item.note}</p>`
                : '';
        return `<div class="ap-item">
            <div class="ap-item-top">
                <span class="ap-item-title">[${item.type}] ${item.summary}</span>
                <span class="ap-badge ${sBadge[item.status]}">${sLabel[item.status]}</span>
            </div>
            <div class="ap-item-meta">${item.applicant} · ${item.amount ? fmt(item.amount)+'원' : '금액 없음'} · ${item.date}</div>
            ${actions}
        </div>`;
    }).join('');
}

function filterList(filter, btn) {
    listFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadList();
}

function decide(id, status) {
    const note = status === 'rejected' ? (prompt('반려 사유를 입력해주세요.') || '') : '';
    if (status === 'rejected' && note === null) return;
    const item = DEMO_APPROVALS.find(r => r.id === id);
    if (item) { item.status = status; item.note = note; }
    showToast(status === 'approved' ? '✅ 승인 완료' : '❌ 반려 완료');
    loadList();
}

// ── 로그인 ────────────────────────────────────────────────
function onLoginLogout() {
    if (demoUser) {
        demoUser = null;
        sessionStorage.removeItem('demo_ap_user');
        document.getElementById('nav-username').textContent = '—';
        showToast('로그아웃 됐습니다.');
    } else {
        const name = prompt('이름을 입력하세요 (홍길동 / 이서연 / 관리자)');
        if (!name) return;
        const pin = prompt('PIN을 입력하세요 (1234 / 0000)');
        if (!pin) return;
        const user = DEMO_USERS.find(u => u.name === name.trim() && u.pin === pin.trim());
        if (!user) { alert('이름 또는 PIN이 올바르지 않습니다.'); return; }
        demoUser = user;
        sessionStorage.setItem('demo_ap_user', JSON.stringify(user));
        document.getElementById('nav-username').textContent = user.name + (user.is_admin ? ' (관리자)' : '');
        showToast('✅ ' + user.name + '님, 로그인됐습니다.');
    }
}
</script>
